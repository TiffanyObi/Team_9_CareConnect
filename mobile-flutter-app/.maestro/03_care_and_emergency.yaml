appId: ${APP_ID}
name: Flutter - care and emergency assistance
---
- launchApp:
    clearState: true
- tapOn: "Email"
- inputText: "omartinez@careconnect.com"
- tapOn: "Password"
- inputText: "password"
- tapOn:
    text: "Sign in"
    index: 1
- extendedWaitUntil:
    visible: "Good morning, Olivia"
    timeout: 15000
- tapOn:
    point: "50%,95%"
- assertVisible: "Your appointments"
- tapOn: "Emergency assistance"
- assertVisible: "Emergency assistance"
- tapOn: "Call emergency services"
- assertVisible: "Emergency services called"
- tapOn: "OK"
