appId: ${APP_ID}
name: Flutter - accessibility settings and logout confirmation
---
- launchApp:
    clearState: true
- tapOn: "Email"
- inputText: "omartinez@careconnect.com"
- tapOn: "Password"
- inputText: "password"
- tapOn:
    text: "Sign in"
    index: 1
- extendedWaitUntil:
    visible: "Good morning, Olivia"
    timeout: 15000
- tapOn:
    point: "90%,95%"
- assertVisible: "Accessibility settings"
- scrollUntilVisible:
    element:
      text: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- scrollUntilVisible:
    element:
      text: "Accessibility settings saved.*"
    direction: UP
- assertVisible: "Accessibility settings saved.*"
- tapOn:
    point: "10%,95%"
- tapOn: "Log out"
- assertVisible: "Log out?"
- tapOn: "Cancel"
- assertVisible: "Good morning, Olivia"
